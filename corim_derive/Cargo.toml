[package]
name = "corim_derive"
version = "0.1.0"
edition = "2021"
description = "Proc-macro derive for CBOR integer-keyed map serialization for CoRIM types."
license = "MIT"
authors = ["Microsoft"]
repository = "https://github.com/microsoft/corim"
keywords = ["corim", "cbor", "attestation", "derive"]
categories = ["encoding", "no-std"]
license-file = "../LICENSE"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
